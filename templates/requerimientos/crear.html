{% extends "base.html" %}

{% block title %}
Nueva solicitud
{% endblock %}

{% block content %}

<h1>Nueva solicitud TI</h1>

<div class="card">

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Enviar solicitud
        </button>

        <a href="{% url 'dashboard' %}" class="btn">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
